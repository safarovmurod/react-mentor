    .brand { display: flex; align-items: center; gap: 10px; margin: 0 4px 22px; }
    .brand-mark { width: 36px; height: 36px; flex: 0 0 auto; background: #18181b; color: white; border-radius: 9px; font-size: 13px; font-weight: 800; letter-spacing: .04em; display:flex; align-items:center; justify-content:center; }

    .mgr-btn:hover { background:#f1f5f9; }

    .op-list { display:flex; flex-direction:column; gap:3px; }
    .op-row { display:flex; align-items:center; gap:2px; border-radius:8px; }
    .op-btn { border:1px solid transparent; background:transparent; color:#334155; border-radius:8px; flex:1; min-width:0; text-align:left; font-size:12.5px; font-weight:650; padding:9px 10px; transition: background .15s; }

    .topbar { display:flex; justify-content:space-between; align-items:center; gap:14px; border-bottom:1px solid var(--border); padding-bottom:17px; margin-bottom:22px; }

    .intro-desc { color:#475569; line-height:1.65; font-size:12.5px; }

    .code-tools { display:flex; gap:7px; align-items:center; flex:0 0 auto; }

    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }

"react-router-dom\"\nimport { useAtomValue, useSetAtom } from \"jotai\"\nimport { GetInfoAtom, infoUserAtom } from \"../store/jotaiStore\"\n\nexport default function Info() {\n  const { id } = useParams()\n  const navigate = useNavigate()\n  const [loading, setLoading] = useState(true)\n  const infoUser = useAtomValue(infoUserAtom)\n  const getInfo = useSetAtom(GetInfoAtom)\n\n  useEffect(() => {\n    async function LoadInfo() {\n      if (!id) return\n      setLoading(true)\n      await getInfo(id)\n      setLoading(false)\n    }\n    LoadInfo()\n  }, [id, getInfo])\n\n  if (loading) return <p>Loading...<\/p>\n  if (!infoUser || String(infoUser.id) !== id) return <p>Todo not found<\/p>\n  return (\n    <div>\n      <button onClick={() => navigate(-1)}>Back<\/button>\n      <h2>{infoUser.name}<\/h2>\n      <p>{infoUser.description}<\/p>\n      <p>{infoUser.isCompleted ? \"Completed\" : \"Not completed\"}<\/p>\n      {infoUser.images?.map((img: any) => (\n        <img key={img.id} src={\"https://to-dos-api.softclub.tj/images/\" + img.imageName} alt={infoUser.name} />\n      ))}\n    <\/div>\n  )\n}","origin":"mixed","place":"NEW Info.tsx: refresh uses id from URL; render only detail here"},{"path":"src/App.tsx - route Info (keep Home + About)","code":"import { createBrowserRouter, RouterProvider } from \"react-router-dom\"\nimport Layout from \"./layout/Layout\"\nimport Jotai from \"./pages/Jotai\"\nimport About from \"./pages/About\"\nimport Info from \"./pages/Info\"\n\nexport default function App() {\n  const router = createBrowserRouter([\n    {\n      path: \"/\",\n      element: <Layout />,\n      children: [\n        { index: true, element: <Jotai /> },\n        { path: \"about\", element: <About /> },\n        { path: \"info/:id\", element: <Info /> },\n      ],\n    },\n  ])\n  return <RouterProvider router={router} />\n}","origin":"mixed","place":"App.tsx: full example using the original Layout + About, plus Info route"}],"origin":"global","memory":"id → GetInfoAtom → set(infoUserAtom) → useAtomValue(infoUserAtom)."},"search":{"title":"SEARCH","intro":"Ҷустуҷӯ дар Jotai бо searchAtom сохта шудааст. Чун getDataAtom дар дохили худ get(searchAtom) дорад, бо тағйири searchAtom, худи Jotai ба таври реактивӣ getDataAtom-ро дубора ҳисоб мекунад!","blocks":[{"path":"src/store/jotaiStore.ts · searchAtom & get()","code":"export const searchAtom = atom(\"\")\n\nexport const getDataAtom = atomWithRefresh(async (get) => {\n  const search = get(searchAtom)\n  const page = get(pageAtom)\n  const { data } = await axios.get(`${api}?query=${search}&PageNumber=${page}&PageSize=4`)\n  return data.data || []\n})","origin":"source","practiceCode":"export const searchAtom = atom(\"\")\n// const search = get(searchAtom)","place":"Store: add the action inside reducers / store / atoms"},{"path":"src/pages/Jotai.tsx","code":"import { useAtom, useAtomValue } from \"jotai\"\nimport { getDataAtom, searchAtom, pageAtom } from \"../store/jotaiStore\"\n\n// Inside JotaiContent():\nconst [search, setSearch] = useAtom(searchAtom)\nconst [, setPage] = useAtom(pageAtom)\nconst data = useAtomValue(getDataAtom)\n\n// Inside return:\n<input value={search} onChange={(e) => {\n  setSearch(e.target.value)\n  setPage(1)\n}} />\n{data?.map((el: any) => <div key={el.id}>{el.name}<\/div>)}","origin":"mixed","place":"JotaiContent(): atom hooks before return; input + map inside"}],"origin":"global","memory":"useAtom(searchAtom) → get(searchAtom) → худкор getDataAtom нав мешавад."},"pagination":{"title":"PAGINATION","intro":"Саҳифабандӣ бо pageAtom сохта шудааст. Вақте setPage даъват мешавад, getDataAtom бо get(pageAtom) ба таври худкор саҳифаи навро мехонад.","blocks":[{"path":"src/store/jotaiStore.ts · pageAtom","code":"export const pageAtom = atom(1)\n\nexport const getDataAtom = atomWithRefresh(async (get) => {\n  const search = get(searchAtom)\n  const page = get(pageAtom)\n  const { data } = await axios.get(`${api}?query=${search}&PageNumber=${page}&PageSize=4`)\n  return data.data || []\n})","origin":"source","practiceCode":"export const pageAtom = atom(1)\n// const page = get(pageAtom)","place":"Store: add the action inside reducers / store / atoms"},{"path":"src/pages/Jotai.tsx","code":"import { useAtom, useAtomValue } from \"jotai\"\nimport { getDataAtom, pageAtom } from \"../store/jotaiStore\"\n\n// Inside JotaiContent():\nconst [page, setPage] = useAtom(pageAtom)\nconst data = useAtomValue(getDataAtom)\n\n// Inside return:\n<button disabled={page <= 1} onClick={() => setPage((p) => p - 1)}>Prev<\/button>\n<span>Page {page}<\/span>\n<button disabled={!data || data.length < 4} onClick={() => setPage((p) => p + 1)}>Next<\/button>\n{data?.map((el: any) => <div key={el.id}>{el.name}<\/div>)}","origin":"mixed","place":"JotaiContent(): atom hooks before return, buttons inside"}],"origin":"global","memory":"setPage → get(pageAtom) → getDataAtom ба таври худкор нав мешавад."},"checkbox":{"title":"CHECKBOX","intro":"Иваз кардани isCompleted бо PUT; логика аз қисми PUT-и файли аслӣ ҷудо шуд.","blocks":[{"path":"src/store/jotaiStore.ts","code":"export const IsCompletedAtom = atom(null, async (get, set, id) => {\n  try {\n    await axios.put(`https://to-dos-api.softclub.tj/completed?id=${id}`)\n    set(getDataAtom)\n  } catch (error) {\n    console.error(error)\n  }\n})","origin":"source","place":"Store: add the action inside reducers / store / atoms"},{"path":"src/pages/Jotai.tsx · Checkbox","code":"import { useSetAtom } from \"jotai\"\nimport { IsCompletedAtom } from \"../store/jotaiStore\"\n\n// Inside JotaiContent() before return:\nconst isCompleted = useSetAtom(IsCompletedAtom)\n\n// Inside data.map((el) => ...):\n<input type=\"checkbox\" checked={!!el.isCompleted} onChange={() => isCompleted(el.id)} />","origin":"source","place":"List page: action hook before return; checkbox inside data.map"}],"origin":"global"},"add-img":{"title":"ADD IMAGE","intro":"AddImgAtom файлҳоро ба FormData гузошта, бо POST ба ${api}/${id}/images мефиристад ва set(getDataAtom) мекунад.","blocks":[{"path":"src/store/jotaiStore.ts · AddImgAtom","code":"export const AddImgAtom = atom(null, async (get, set, { id, file }) => {\n  try {\n    const formData = new FormData()\n    for (let i = 0; i < file.length; i++) {\n      formData.append(\"Images\", file[i])\n    }\n    await axios.post(`${api}/${id}/images`, formData)\n    set(getDataAtom)\n  } catch (error) {\n    console.error(error)\n  }\n})","origin":"source","practiceCode":"export const AddImgAtom = atom(null, async (get, set, { id, file }) => {\n  try {\n    // STEP: FormData соз ва axios.post + set(getDataAtom)\n    const formData = new FormData()\n    for (let i = 0; i < file.length; i++) {\n      formData.append(\"Images\", file[i])\n    }\n    await axios.post(`${api}/${id}/images`, formData)\n    set(getDataAtom)\n  } catch (error) {\n    console.error(error)\n  }\n})","place":"Store: add the action inside reducers / store / atoms"},{"path":"src/pages/Jotai.tsx","code":"import { useSetAtom } from \"jotai\"\nimport { AddImgAtom } from \"../store/jotaiStore\"\n\nconst addImgData = useSetAtom(AddImgAtom)\n\n// In JotaiContent() return -> data.map((el) => ...):\n<input type=\"file\" accept=\"image/*\" multiple onChange={(e) => {\n  if (e.target.files?.length) addImgData({ id: el.id, file: e.target.files })\n}} />","origin":"mixed","place":"List page: file input inside todo .map; API action in store"}],"origin":"global","memory":"file → FormData → axios.post → set(getDataAtom)."},"delete-img":{"title":"DELETE IMAGE","intro":"DeleteImgAtom расмро бо axios.delete(`${api}/images/${imageId}`) нест мекунад ва set(getDataAtom) менамояд.","blocks":[{"path":"src/store/jotaiStore.ts · DeleteImgAtom","code":"export const DeleteImgAtom = atom(null, async (get, set, imageId) => {\n  try {\n    await axios.delete(`${api}/images/${imageId}`)\n    set(getDataAtom)\n  } catch (error) {\n    console.error(error)\n  }\n})","origin":"source","practiceCode":"export const DeleteImgAtom = atom(null, async (get, set, imageId) => {\n  try {\n    // STEP: await axios.delete(`${api}/images/${imageId}`) ва set(getDataAtom)\n    await axios.delete(`${api}/images/${imageId}`)\n    set(getDataAtom)\n  } catch (error) {\n    console.error(error)\n  }\n})","place":"Store: add the action inside reducers / store / atoms"},{"path":"src/pages/Jotai.tsx","code":"import { useSetAtom } from \"jotai\"\nimport { DeleteImgAtom } from \"../store/jotaiStore\"\n\nconst deleteImgData = useSetAtom(DeleteImgAtom)\n\n// In JotaiContent() return -> data.map((el) => ...):\n{el.images?.map((img: any) => (\n  <div key={img.id}>\n    <img src={\"https://to-dos-api.softclub.tj/images/\" + img.imageName} alt=\"\" />\n    <button onClick={() => deleteImgData(img.id)}>Delete Image<\/button>\n  <\/div>\n))}","origin":"mixed","place":"List page: image loop is nested inside the selected todo loop"}],"origin":"global","memory":"imageId → axios.delete(/images/id) → set(getDataAtom)."}}}}</script>
<script>
(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('DATA').textContent);
  const managers = { redux: 'Redux Toolkit', zustand: 'Zustand', jotai: 'Jotai' };
  const hints = {
    setup: 'Аввал store ё atom-ро соз, баъд дар компонент истифода бар.',
    post: 'Массив: [user, ...data]. Барои Global: POST ва refresh.',
    put: 'Бо map() id-ро ёб, user-ро иваз кун. Барои Global: PUT.',
    delete: 'Бо filter() id-и лозимиро хориҷ кун.',
    info: 'Бо find() як user-ро аз рӯйи id гир. Дар Global: request бо id.',
    search: 'filter() + toLowerCase() + includes().',
    pagination: 'slice((page - 1) * pageSize, page * pageSize).',
    checkbox: 'Бо map() isCompleted: !el.isCompleted. Дар Global: axios.put.',
    'add-img': 'Local: image string. Global: FormData ва Images.',
    'delete-img': 'Local: image: "". Global: delete request ба image id.'
  };
  const storageKey = 'state-practice-v3';
  let state = { mode: 'local', manager: 'redux', op: 'post', practice: false, hint: false, hidden: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
    if (saved && ['local','global'].includes(saved.mode) && managers[saved.manager] && DATA.operations.some(op=>op.id===saved.op)) {
      state = { ...state, ...saved };
    }
  } catch (error) { /* Browser may block storage for local files */ }
  try {
    const hash = decodeURIComponent(location.hash.slice(1)).split('/');
    if (hash.length === 3 && ['local','global'].includes(hash[0]) && managers[hash[1]] && DATA.operations.some(op=>op.id===hash[2])) {
      state.mode=hash[0]; state.manager=hash[1]; state.op=hash[2];
    }
  } catch (error) { /* Invalid hash is ignored */ }
  const byId = (id) => document.getElementById(id);
  const keyOf = () => state.mode + ':' + state.manager;
  const hiddenHere = () => Array.isArray(state.hidden?.[keyOf()]) ? state.hidden[keyOf()] : [];
  const lesson = () => DATA[state.mode][state.manager][state.op];
  function save() {
    try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (error) { /* skip */ }
    try { history.replaceState(null, '', '#' + state.mode + '/' + state.manager + '/' + state.op); } catch (error) { /* skip */ }
  }
  function changeManager(manager) { state.manager=manager; ensureVisible(); render(); }
  function changeMode(mode) { state.mode=mode; ensureVisible(); render(); }
  function changeOp(op) { state.op=op; render(); byId('workspace').scrollTo({top:0,behavior:'instant'}); }
  function ensureVisible() {
    if (hiddenHere().includes(state.op)) {
      state.op = DATA.operations.find(op => !hiddenHere().includes(op.id))?.id || 'post';
    }
  }
  function hideOp(op) {
    state.hidden[keyOf()] = [...hiddenHere(),op];
    ensureVisible(); render();
  }
  function restoreOp(op) {
    state.hidden[keyOf()] = hiddenHere().filter(k => k !== op);
    state.op = op; render();
  }
  function renderSidebar() {
    for (const manager of Object.keys(managers)) {
      const btn=byId('mgr-'+manager);
      btn.classList.toggle('active',state.manager===manager);
      btn.setAttribute('aria-current',state.manager===manager ? 'page':'false');
    }
    for (const mode of ['local','global']) {
      const btn=byId('mode-'+mode);
      btn.classList.toggle('active',state.mode===mode);
      btn.setAttribute('aria-pressed',String(state.mode===mode));
    }
    const list=byId('op-list');
    const hidden=hiddenHere();
    list.replaceChildren();
    for (const op of DATA.operations) {
      if (hidden.includes(op.id)) continue;
      const row=document.createElement('div'); row.className='op-row';
      const btn=document.createElement('button'); btn.type='button'; btn.className='op-btn'+(state.op===op.id?' active':'');
      btn.textContent=op.title; btn.setAttribute('aria-current',state.op===op.id?'page':'false');
      btn.addEventListener('click',()=>changeOp(op.id));
      const remove=document.createElement('button'); remove.type='button'; remove.className='hide-op'; remove.textContent='×';
      remove.setAttribute('aria-label','Пинҳон кардан: '+op.title); remove.title='Пинҳон';
      remove.addEventListener('click',()=>hideOp(op.id));
      row.append(btn,remove); list.appendChild(row);
    }
    byId('hidden-section').hidden=hidden.length===0;
    const box=byId('hidden-items'); box.replaceChildren();
    if (!hidden.length) {
      const empty=document.createElement('div'); empty.className='hidden-empty'; empty.textContent='Пинҳоншуда нест'; box.append(empty);
    }
    for (const id of hidden) {
      const op=DATA.operations.find(o=>o.id===id); if(!op)continue;
      const row=document.createElement('div'); row.className='hidden-row';
      const name=document.createElement('span'); name.textContent=op.title;
      const btn=document.createElement('button'); btn.type='button'; btn.className='restore'; btn.textContent='Барқарор';
      btn.addEventListener('click',()=>restoreOp(id)); row.append(name,btn); box.appendChild(row);
    }
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const tokenPattern = /\/\/.*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b(?:import|export|const|let|var|async|await|return|try|catch|from|if|else|new|function|type|interface|as|true|false|null|undefined)\b|\b(?:createSlice|createAsyncThunk|configureStore|create|useUserStore|atom|atomWithRefresh|useSetAtom|useAtomValue|useAtom|useSelector|useDispatch|axios|set|map|filter|find|slice|includes|console|dispatch|FormData)\b|\b\d+\b/g;
  function highlight(line) {
    let out='',last=0;
    for(const match of line.matchAll(tokenPattern)) {
      const token=match[0]; out+=escapeHtml(line.slice(last,match.index));
      const type=token.startsWith('//')?'comment':/["'`]/.test(token[0])?'string':/^\d/.test(token)?'num':/^(import|export|const|let|var|async|await|return|try|catch|from|if|else|new|function|type|interface|as|true|false|null|undefined)$/.test(token)?'key':'fn';
      out+='<span class="tok-'+type+'">'+escapeHtml(token)+'</span>'; last=match.index+token.length;
    }
    return out+escapeHtml(line.slice(last));
  }
  function makePractice(code, op, withHint) {
    const lines=code.split('\n');
    const imports=lines.filter(l=>/^import\s/.test(l));
    const first=lines.find(l=>/=>|function\s|reducers:|export const|create\(|configureStore|const\s/.test(l)) || lines[0] || '';
    return [...imports.slice(0,4), ...(imports.includes(first)?[]:[first]), '  // '+(withHint?hints[op]:'Ин қисмро худат аз хотира навис.'), '  // ...'].join('\n');
  }
  function visibleCode(block) {
    if (!state.practice) return block.code;
    if (state.hint && block.hintCode) return block.hintCode;
    if (!state.hint && block.practiceCode) return block.practiceCode;
    return makePractice(block.code,state.op,state.hint);
  }
  function showSource(origin) {
    return origin==='zip'?'react.zip':origin==='source'?'Practice-Antigraviti':origin==='mixed'?'Асл + илова':'Local';
  }
  function renderCode() {
    const l=lesson(),container=byId('files-code'); container.replaceChildren();
    byId('files-count').textContent=l.blocks.length+' файл / қисм · Ҳар қисмро ҷудогона нусха гир';
    l.blocks.forEach((block,index)=>{
      const box=document.createElement('section'); box.className='code-box';
      const header=document.createElement('div'); header.className='code-header';
      const path=document.createElement('span'); path.className='code-path'; path.textContent=block.path;
      const tools=document.createElement('div'); tools.className='code-tools';
      const source=document.createElement('span'); source.className='source-tag'; source.textContent=showSource(block.origin);
      const lang=document.createElement('span'); lang.className='lang-tag'; lang.textContent=/\.tsx\b/.test(block.path)?'TSX':'TS';
      const copy=document.createElement('button'); copy.type='button';copy.className='copy-btn';copy.textContent='Нусха';
      copy.addEventListener('click',()=>copyText(visibleCode(block),copy));
      tools.append(source,lang,copy);header.append(path,tools);
      const placement=document.createElement('div');placement.className='code-placement';
      placement.textContent=block.place || '';
      const content=document.createElement('div');content.className='code-content';
      const pre=document.createElement('pre');pre.className='code-lines';
      const lines=visibleCode(block).split('\n');
      pre.innerHTML=lines.map((line,i)=>'<span class="code-line" data-line="'+(i+1)+'">'+(highlight(line)||' ')+'</span>').join('');
      content.append(pre);box.append(header,placement,content);
      if(state.hint){const hint=document.createElement('div');hint.className='hint';hint.textContent='💡 '+hints[state.op];box.append(hint);}
      container.append(box);
    });
  }
  function render() {
    ensureVisible();
    renderSidebar();
    const l=lesson();
    const mode=state.mode==='local'?'Local':'Global';
    const op=DATA.operations.find(o=>o.id===state.op);
    byId('breadcrumb').textContent=managers[state.manager]+' · '+op.title;
    byId('position').textContent=mode+' / '+managers[state.manager]+' / '+op.title;
    byId('intro-title').textContent=op.title+' · '+mode;
    byId('intro-desc').textContent=l.intro;
    byId('practice-check').checked=state.practice;
    byId('hint-check').checked=state.hint;
    const warn=byId('local-warning');
    if(state.mode==='local' && state.manager==='redux' && state.op==='post') {
      warn.hidden=false;
      warn.textContent='Дар AddDialog-и аслӣ id ва status ба newUser илова нашудаанд. Кодро тағйир надодам.';
    } else {
      warn.hidden=true;warn.textContent='';
    }
    renderCode();save();
  }
  async function copyText(value,btn) {
    try {
      if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(value);}
      else {
        const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.left='-9999px';document.body.append(el);el.select();
        const success=document.execCommand('copy');el.remove(); if(!success)throw new Error('copy failed');
      }
      const old=btn.textContent;btn.textContent='Нусха шуд ✓';btn.disabled=true;
      setTimeout(()=>{btn.textContent=old;btn.disabled=false;},950);
    } catch(error) {btn.textContent='Нусха нашуд';setTimeout(()=>{btn.textContent='Нусха';},1600);}
  }
  document.querySelectorAll('[data-manager]').forEach(btn=>btn.addEventListener('click',()=>changeManager(btn.dataset.manager)));
  document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>changeMode(btn.dataset.mode)));
  byId('practice-check').addEventListener('change',e=>{state.practice=e.target.checked;render();});
  byId('hint-check').addEventListener('change',e=>{state.hint=e.target.checked;render();});
  byId('copy-all').addEventListener('click',()=>{
    const text=lesson().blocks.map(b=>'// '+b.path+'\n'+visibleCode(b)).join('\n\n');
    copyText(text,byId('copy-all'));
  });
  window.addEventListener('hashchange',()=>{
    const bits=location.hash.slice(1).split('/');
    if(bits.length===3 && ['local','global'].includes(bits[0]) && managers[bits[1]] && DATA.operations.some(o=>o.id===bits[2])) {
      state.mode=bits[0];state.manager=bits[1];state.op=bits[2];render();
    }
  });
  render();
})();
</script>
